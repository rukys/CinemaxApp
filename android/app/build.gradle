apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

apply plugin: 'com.google.gms.google-services'

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Release signing. Never commit these values to the repo.
 * Set them in ~/.gradle/gradle.properties (local) or as environment variables (CI).
 */
def readSigningValue(String name) {
    def value = project.findProperty(name) ?: System.getenv(name)
    return value ? value.toString() : null
}
def releaseStoreFile = readSigningValue('MYAPP_UPLOAD_STORE_FILE')
def releaseStorePassword = readSigningValue('MYAPP_UPLOAD_STORE_PASSWORD')
def releaseKeyAlias = readSigningValue('MYAPP_UPLOAD_KEY_ALIAS')
def releaseKeyPassword = readSigningValue('MYAPP_UPLOAD_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias &&
        releaseKeyPassword && file(releaseStoreFile).exists()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cinemaxapp"
    defaultConfig {
        applicationId "com.cinemaxapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 6
        versionName "1.1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Release signing values are read from ~/.gradle/gradle.properties or
            // environment variables (see README). Without them, the release build is unsigned.
            // see https://reactnative.dev/docs/signed-apk-android.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"
